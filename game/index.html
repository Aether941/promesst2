<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROMESST 2 · 网页版移植 — M2(移动)</title>
<style>
  :root{ --bg:#0d1017; --panel:#171d2d; --line:#2b3450; --txt:#d9dee9; --dim:#8b93a7; --accent:#b07cff; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--txt);
       font:14px/1.6 "Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
       display:flex; flex-direction:column}
  header{padding:10px 16px 4px}
  header h1{margin:0; font-size:19px; color:#fff}
  header p{margin:0; color:var(--dim); font-size:12px}
  #bar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:8px 16px;
       border-bottom:1px solid var(--line); background:var(--panel)}
  .badge{background:#232c4a; border:1px solid var(--line); border-radius:7px; padding:3px 10px;
         font:12px Consolas,monospace; color:#ffd9b0; white-space:nowrap}
  .badge b{color:#fff}
  .btn{background:#1d2438; color:var(--txt); border:1px solid var(--line); border-radius:7px;
       padding:4px 11px; cursor:pointer; font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .btn.on{background:#3a2b63; border-color:var(--accent); color:#fff}
  label.chk{display:flex; align-items:center; gap:5px; font-size:13px; color:var(--dim); cursor:pointer}
  label.chk input{accent-color:var(--accent)}
  .sp{flex:1}
  #stage{flex:1; overflow:auto; position:relative; background:#0a0c12; padding:12px}
  #stage::-webkit-scrollbar{width:10px;height:10px}
  #stage::-webkit-scrollbar-thumb{background:#2b3450;border-radius:6px}
  canvas{display:block; image-rendering:pixelated; background:#000;
         box-shadow:0 0 0 1px var(--line); margin:0 auto}
  #info{padding:6px 16px; color:var(--dim); font-size:12.5px; border-top:1px solid var(--line); min-height:1.4em}
  #info b{color:#ffd9b0}
  #err{display:none; margin:10px 16px; background:#2a0f14; color:#ffb4bc; border:1px solid #ff6b7a;
        border-radius:8px; padding:10px 14px; font:12px/1.6 Consolas,monospace; white-space:pre-wrap}
  kbd{background:#232b44;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px;
      font-family:Consolas,monospace;color:#e6e1ff}
</style>
</head>
<body>
<header>
  <h1>PROMESST 2 · 网页版 — M2 里程碑(移动 / 碰撞 / 整幅地图)</h1>
  <p>按 <code>docs-map-port/README.md</code> v4 移植。M2 范围:整幅当前层地图、玩家移动、原版碰撞规则(无能力阶段)、80ms 步进、缩放/跟随。</p>
</header>

<div id="err"></div>

<div id="bar">
  <span class="badge">层 <b id="bz">Z0</b></span>
  <span class="badge">格 <b id="bxy">(?, ?)</b></span>
  <span class="badge">房间 <b id="broom">(?, ?)</b></span>
  <span class="badge">朝向 <b id="bfacing">—</b></span>
  <span class="badge">步数 <b id="bsteps">0</b></span>
  <span class="sp"></span>
  <label class="chk"><input type="checkbox" id="ckFollow" checked>跟随玩家</label>
  <button class="btn" id="btnFit">适配窗口</button>
  <button class="btn" id="btnZo">−</button>
  <button class="btn" id="btnZi">＋</button>
  <button class="btn" id="btnRestart">重新开始</button>
</div>

<div id="stage"><canvas id="cv"></canvas></div>

<div id="info">
  <kbd>方向键</kbd>/<kbd>WASD</kbd> 移动 ·
  <kbd>#</kbd> 楼梯切层 · 操作说明见 <code>readme2.txt</code> 风格提示:
  红色光束=开门 / 绿色=穿墙 / 黄色=碎石 / 橙色=双步 / 紫色=沿光束远行 —— <b>能力系统在 M3 启用</b>,当前为“无能力”碰撞。
</div>

<script src="./map-data.js"></script>
<script src="./game.js"></script>
</body>
</html>
